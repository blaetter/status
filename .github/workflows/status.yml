name: Update status

# Builds status.json and force-pushes it as the only file of the branch
# `status-data`. The page loads it from raw.githubusercontent.com, so data
# updates need no GitHub Pages deployment.

on:
  workflow_dispatch:         # main trigger, called every 5 minutes by an external scheduler
  schedule:
    - cron: "*/5 * * * *"   # fallback only: GitHub often skips short schedules

permissions:
  contents: write

concurrency:
  group: status-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Tests
        run: tests/run.sh

      - name: Build status.json
        env:
          UPDOWN_API_KEY: ${{ secrets.UPDOWN_API_KEY }}
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
        run: scripts/build-status.sh "$RUNNER_TEMP/status.json"

      - name: Publish to branch status-data
        run: |
          git switch --orphan status-data
          cp "$RUNNER_TEMP/status.json" status.json
          git add status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update status data"
          git push -q --force origin status-data
