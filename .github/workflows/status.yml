name: Update status

on:
  schedule:
    - cron: "*/5 * * * *"   # fallback only: GitHub often skips short schedules
    - cron: "17 4 * * 1"    # Mondays: keepalive commit, see below
  workflow_dispatch:         # main trigger, called every 5 minutes by an external scheduler
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Tests
        run: tests/run.sh

      - name: Build status.json
        env:
          UPDOWN_API_KEY: ${{ secrets.UPDOWN_API_KEY }}
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html assets .nojekyll _site/
          scripts/build-status.sh _site/status.json

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  # GitHub disables schedules in public repositories after 60 days without activity.
  keepalive:
    if: github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Commit keepalive timestamp
        run: |
          date -u +%FT%TZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keepalive for scheduled workflows"
          git push
