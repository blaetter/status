name: Publish page

# Publishes the static page (no data) with GitHub Pages.
# Runs only when the page itself changes, or by hand.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - tests/design-tokens.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      # Colours and fonts come from the design tokens of the Blätter layouts (public repository);
      # the page is not published when its copies differ or it sets colours of its own.
      - uses: actions/checkout@v7.0.1
        with:
          repository: blaetter/blaetter-design
          path: .design
          persist-credentials: false

      - name: Colours match blaetter-design
        run: tests/design-tokens.sh .design

      - name: Collect page files
        run: |
          mkdir -p _site
          cp -r index.html assets .nojekyll _site/

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
